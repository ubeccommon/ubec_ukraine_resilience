name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python syntax (py_compile)
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Shell syntax (bash -n)
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: CITATION.cff schema
        run: |
          pip install --quiet cffconvert
          cffconvert --validate

      - name: Repository rules
        run: bash .github/workflows/guards.sh
